name: Build PSP EBOOT

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix code header
        run: |
          sed -i '1i #include <stdlib.h>' source/player.c

      - name: Build project
        run: |
          make

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT-PBP
          path: EBOOT.PBP
