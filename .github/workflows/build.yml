name: Build PSP EBOOT

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Unzip project if zip exists
        run: |
          if [ -f "voxelcraft.zip" ]; then unzip -o voxelcraft.zip -d . ; fi
          if [ -d "voxelcraft" ]; then cp -r voxelcraft/* . ; fi

      - name: Build with PSPSDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src pspsdk/pspsdk make

      - name: Upload EBOOT
        uses: actions/upload-artifact@v3
        with:
          name: EBOOT-PBP
          path: EBOOT.PBP
