name: Build PSP ISO

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Project inside PSP Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src pspdev/pspdev:latest bash -c "
            sed -i '1i #include <stdlib.h>' source/player.c &&
            make
          "

      - name: Create ISO Image
        run: |
          sudo apt-get update && sudo apt-get install -y genisoimage
          mkdir -p iso_root/PSP_GAME/SYSDIR
          cp EBOOT.PBP iso_root/PSP_GAME/SYSDIR/EBOOT.BIN
          genisoimage -A "PSP GAME" -V "GAME" -sysid "PSP" -o game.iso iso_root

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: PSP-ISO-File
          path: game.iso
