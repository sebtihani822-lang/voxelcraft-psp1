name: Build PSP ISO

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix code header
        run: |
          sed -i '1i #include <stdlib.h>' source/player.c

      - name: Build project
        run: |
          make
          pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL DATA.PSP
          genisoimage -o game.iso EBOOT.PBP

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: PSP-ISO-File
          path: game.iso
