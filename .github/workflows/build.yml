name: Build PSP EBOOT

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with PSPSDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src pspsdk/pspsdk make

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT-PBP
          path: EBOOT.PBP
